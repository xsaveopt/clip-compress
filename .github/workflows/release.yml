name: CI

on:
  push:
    branches: ["**"]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "1"
  GOFLAGS: "-tags=nomanifest"
  VT_API_KEY: ${{ secrets.VT_API_KEY }}

jobs:
  ffmpeg:
    name: Build ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache
        with:
          path: build/ffmpeg/out
          key: ffmpeg-${{ hashFiles('build/ffmpeg/build.sh') }}

      - name: Install cross toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64 nasm yasm meson ninja-build cmake pkg-config curl xz-utils libz-mingw-w64-dev

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/ffmpeg/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win64
          path: build/ffmpeg/out
          retention-days: 7

  ci:
    name: Lint, test & build
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found issues; run 'gofmt -w .'"
            exit 1
          fi

      - run: go vet ./...

      - run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Generate Windows resources
        shell: bash
        run: go tool goversioninfo -64 -arm=false -o resource_windows_amd64.syso build/versioninfo.json

      - name: Build
        shell: bash
        run: go build -trimpath -ldflags "-H windowsgui -X main.version=dev-${GITHUB_SHA::7}" -o clip-compress.exe .

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-win64
          path: .

      - name: Verify ffmpeg build
        shell: bash
        run: |
          for enc in h264_nvenc hevc_nvenc av1_nvenc aac libopus; do
            ./ffmpeg.exe -hide_banner -encoders | grep -qw "$enc" || { echo "::error::missing encoder $enc"; exit 1; }
          done
          ./ffmpeg.exe -hide_banner -loglevel error -f lavfi -i testsrc=duration=0.2:size=320x240:rate=30 \
            -pix_fmt yuv420p -f null -
          ./ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i sine=duration=0.2 -c:a aac -movflags +faststart smoke.mp4
          ./ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i sine=duration=0.2 -c:a libopus smoke.webm
          ./ffmpeg.exe -hide_banner -loglevel error -i smoke.mp4 -f null -
          rm -f smoke.mp4 smoke.webm

      - name: Build dev installer
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DDev "/DAppVersion=0.0.0-dev-$($env:GITHUB_SHA.Substring(0,7))" build\installer.iss

      - name: Scan with VirusTotal
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            clip-compress.exe
            dist/ClipCompressSetup-Dev.exe

      - name: VirusTotal summary
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && env.VT_API_KEY != '' }}
        shell: bash
        run: |
          {
            echo "### VirusTotal scans"
            echo
            echo "Artifacts download as a zip; hash the extracted file, not the zip."
            echo
            for f in clip-compress.exe dist/ClipCompressSetup-Dev.exe; do
              sha=$(sha256sum "$f" | cut -d ' ' -f1)
              echo "- [$(basename "$f")](https://www.virustotal.com/gui/file/$sha) \`$sha\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dev build
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: clip-compress-dev-${{ github.sha }}
          path: |
            clip-compress.exe
            ffmpeg.exe
            dist/ClipCompressSetup-Dev.exe
          retention-days: 14

  release:
    name: Publish release
    needs: [ffmpeg, ci]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Windows resources
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          IFS=. read -r major minor patch <<< "$v"
          go tool goversioninfo -64 -arm=false -o resource_windows_amd64.syso \
            -ver-major "${major:-0}" -ver-minor "${minor:-0}" -ver-patch "${patch:-0}" \
            -file-version "$v.0" -product-version "$v.0" \
            build/versioninfo.json

      - name: Build binary
        shell: bash
        run: go build -trimpath -ldflags "-H windowsgui -X main.version=${GITHUB_REF_NAME}" -o clip-compress.exe .

      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-win64
          path: .

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" build\installer.iss

      - name: Name installer
        shell: pwsh
        run: Rename-Item dist\ClipCompressSetup.exe "ClipCompressSetup-${{ steps.ver.outputs.version }}.exe"

      - name: Scan with VirusTotal
        id: vt
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: dist/*

      - name: VirusTotal summary
        id: vtsum
        if: ${{ env.VT_API_KEY != '' }}
        shell: bash
        run: |
          {
            echo "results<<EOF"
            echo "### VirusTotal scans"
            for f in dist/*; do
              sha=$(sha256sum "$f" | cut -d ' ' -f1)
              echo "- [$(basename "$f")](https://www.virustotal.com/gui/file/$sha)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: ${{ steps.vtsum.outputs.results }}
          files: dist/*
